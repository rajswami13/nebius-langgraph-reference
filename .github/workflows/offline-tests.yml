# Offline checks only. Live conformance runs need a Token Factory key and are run manually.
name: offline-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run nebius-agent --help
      - run: uv run pytest tests
